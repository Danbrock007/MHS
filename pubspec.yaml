name: mhs
version: 3.0.0+3
publish_to: none
description: Offline mobile school fees management for Faisalabad Mesali High School.
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^11.0.0
  screenshot: ^3.0.0
  fl_chart: ^1.0.0
  shared_preferences: ^2.5.3
  excel: ^4.0.6
  crypto: ^3.0.6
  flutter_launcher_icons: ^0.14.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.png
  adaptive_icon_background: '#0B1220'
  adaptive_icon_foreground: assets/images/logo.png
